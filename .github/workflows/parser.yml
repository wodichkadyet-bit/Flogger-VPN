name: Flogger VPN Parser 4.3

on:
  workflow_dispatch:

  schedule:
    # Каждый час в 17 минут (UTC)
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: flogger-vpn-parser
  cancel-in-progress: false

jobs:
  parser:
    name: Collect and check servers

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")

          VERSION="${VERSION#v}"

          echo "Installing sing-box ${VERSION}"

          curl -fL \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
            -o sing-box.tar.gz

          tar -xzf sing-box.tar.gz

          BINARY=$(find . -type f -name sing-box -perm -111 | head -n 1)

          test -n "$BINARY"

          sudo install "$BINARY" /usr/local/bin/sing-box

          sing-box version

      - name: Verify project
        run: |
          test -f parser.py
          test -f checker.py
          test -f sources.txt

          python -m py_compile parser.py checker.py

          echo "Project files verified"

      - name: Run Flogger Parser
        run: |
          python -u parser.py

      - name: Verify results
        run: |
          test -f subscription.txt
          test -f stats.json
          test -f servers.json
          test -d results

          echo "Generated files verified"

      - name: Save results to GitHub
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Flogger Bot"
          git config user.email "actions@github.com"

          git add subscription.txt
          git add stats.json
          git add servers.json
          git add results/

          if ! git diff --cached --quiet; then
            git commit -m "Update Flogger VPN subscription & database [v4.3]"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes to save"
          fi

      - name: Completion
        if: success()
        run: echo "FLOGGER VPN PARSER COMPLETED SUCCESSFULLY"
        
