name: Flogger VPN Parser

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  parser:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Flogger Parser
        run: python parser.py

      - name: Save results
        run: |
          git config user.name "Flogger Bot"
          git config user.email "actions@github.com"
          git add subscription.txt stats.json
          git diff --cached --quiet || git commit -m "Update Flogger subscription"
          git push
          
